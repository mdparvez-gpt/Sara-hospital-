<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Hospital - Office Intercom</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Registration Modal -->
<div id="reg-modal" class="modal-overlay" style="display:none;">
    <div class="landline-base modal-box">
        <div class="brand-title">SARA HOSPITAL</div>
        <div class="brand-sub">INTERNAL IP INTERCOM</div>
        <input type="text" id="reg-name" placeholder="আপনার নাম বা ডিপার্টমেন্ট (যেমন: ICU Desk)">
        <input type="text" id="reg-ext" placeholder="এক্সটেনশন নম্বর / UID (যেমন: 101)">
        <button onclick="registerUser()" class="landline-save-btn">রেজিস্ট্রেশন করুন</button>
    </div>
</div>

<!-- Landline Phone Main Container -->
<div class="landline-phone" id="app-container" style="display:none;">
    <div class="lcd-screen">
        <div class="lcd-header">
            <span id="user-info-display">Ext: --</span>
            <span class="live-indicator">● ACTIVE</span>
        </div>
        <div class="lcd-display-text" id="screen-display">READY</div>
    </div>

    {/* Section 1: Phone Book Directory */}
    <div class="directory-panel">
        <div class="directory-title">📁 ফোনবুক (সকল রেজিস্টার্ড ইউজার)</div>
        <div id="phonebook-list" class="users-scroll">
            <span class="no-user">লোড হচ্ছে...</span>
        </div>
    </div>

    {/* Section 2: Online Status */}
    <div class="directory-panel" style="margin-top: 8px;">
        <div class="directory-title">🟢 বর্তমানে অনলাইনে আছেন</div>
        <div id="online-users-list" class="users-scroll">
            <span class="no-user">কেউ অনলাইন নেই...</span>
        </div>
    </div>

    <!-- Physical Keypad Layout -->
    <div class="keypad-panel" style="margin-top: 10px;">
        <div class="keypad-grid">
            <button class="k-btn" onclick="pressKey('1')">1</button>
            <button class="k-btn" onclick="pressKey('2')">2</button>
            <button class="k-btn" onclick="pressKey('3')">3</button>
            <button class="k-btn" onclick="pressKey('4')">4</button>
            <button class="k-btn" onclick="pressKey('5')">5</button>
            <button class="k-btn" onclick="pressKey('6')">6</button>
            <button class="k-btn" onclick="pressKey('7')">7</button>
            <button class="k-btn" onclick="pressKey('8')">8</button>
            <button class="k-btn" onclick="pressKey('9')">9</button>
            <button class="k-btn" onclick="pressKey('*')">*</button>
            <button class="k-btn" onclick="pressKey('0')">0</button>
            <button class="k-btn" onclick="pressKey('#')">#</button>
        </div>
        <div class="action-row">
            <button class="k-btn backspace-btn" onclick="backspaceKey()">⌫ ডিলিট</button>
            <button class="k-btn call-action-btn" onclick="makeCall()">☎ কল করুন</button>
        </div>
    </div>

    <div class="phone-footer">
        <button onclick="logoutUser()" class="logout-link">লগআউট / অ্যাকাউন্ট পরিবর্তন</button>
    </div>
</div>

<!-- Messenger Style Chat Window -->
<div id="chat-modal" class="incoming-screen" style="display:none;">
    <div class="incoming-card chat-card">
        <div class="chat-header">
            <h3 id="chat-target-name">Chat</h3>
            <button onclick="closeChat()" class="close-chat-btn">✖</button>
        </div>
        <div id="chat-messages" class="chat-messages-area">
            <!-- Messages -->
        </div>
        <div class="chat-input-area">
            <input type="file" id="chat-file-input" style="display:none" onchange="handleFileUpload(event)">
            <button onclick="document.getElementById('chat-file-input').click()" class="attachment-btn" title="ফাইল বা ছবি সংযুক্ত করুন">📎</button>
            <input type="text" id="chat-text-input" placeholder="মেসেজ লিখুন..." onkeypress="handleChatKeyPress(event)">
            <button onclick="sendChatMessage()" class="send-msg-btn">➤</button>
            <button onclick="startCallFromChat()" class="chat-call-btn" title="কল করুন">📞</button>
        </div>
    </div>
</div>

<!-- Incoming Call Screen -->
<div id="incoming-modal" class="incoming-screen" style="display:none;">
    <div class="incoming-card">
        <div class="ringing-pulse">📞</div>
        <h2>ইনকামিং কল...</h2>
        <p id="caller-info" class="caller-name-display"></p>
        <div class="incoming-buttons">
            <button onclick="answerCall()" class="ans-call-btn">রিসিভ করুন</button>
            <button onclick="rejectCall()" class="rej-call-btn">কেটে দিন</button>
        </div>
    </div>
</div>

<!-- Running Call Screen -->
<div id="active-call-modal" class="incoming-screen" style="display:none;">
    <div class="incoming-card">
        <div class="running-icon">🎙️</div>
        <h3>কথোপকথন চলছে</h3>
        <p id="connected-target-info" class="target-talking"></p>
        <p id="call-timer" class="timer-text">Connecting...</p>
        <div class="running-controls">
            <button onclick="toggleSpeaker()" id="speaker-btn" class="ctrl-btn">🔊 স্পিকার: বন্ধ</button>
            <button onclick="hangUp()" class="end-call-btn">✖ কল কাটুন</button>
        </div>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>
<script src="app.js"></script>
</body>
</html>
