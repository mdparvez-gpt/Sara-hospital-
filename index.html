<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Hospital Intercom</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<!-- Registration Overlay (First Screen) -->
<div id="reg-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <h2>Sara Hospital Intercom</h2>
        <p>আপনার প্রোফাইল সেটআপ করুন</p>
        <input type="text" id="reg-name" placeholder="আপনার নাম / ডিপার্টমেন্ট (যেমন: ICU)">
        <input type="text" id="reg-ext" placeholder="এক্সটেনশন নম্বর (যেমন: 101)">
        <button onclick="registerUser()">প্রবেশ করুন</button>
    </div>
</div>

<!-- Main App Container -->
<div class="phone-container" id="app-container" style="display:none;">
    <div class="header-info">
        <h3 id="user-info-display" style="margin:0; color:#38bdf8;"></h3>
        <button onclick="logoutUser()" style="background:#ef4444; width:auto; padding:4px 10px; font-size:12px;">লগআউট</button>
    </div>

    <!-- Screen Display -->
    <div class="screen" id="screen-display">নম্বর ডায়াল করুন</div>

    <!-- Keypad -->
    <div class="keypad">
        <button class="btn" onclick="pressKey('1')">1</button>
        <button class="btn" onclick="pressKey('2')">2</button>
        <button class="btn" onclick="pressKey('3')">3</button>
        <button class="btn" onclick="pressKey('4')">4</button>
        <button class="btn" onclick="pressKey('5')">5</button>
        <button class="btn" onclick="pressKey('6')">6</button>
        <button class="btn" onclick="pressKey('7')">7</button>
        <button class="btn" onclick="pressKey('8')">8</button>
        <button class="btn" onclick="pressKey('9')">9</button>
        <button class="btn" onclick="pressKey('*')">*</button>
        <button class="btn" onclick="pressKey('0')">0</button>
        <button class="btn" onclick="pressKey('#')">#</button>
        <button class="btn call-btn" id="call-btn" onclick="makeCall()">কল করুন ☎</button>
        <button class="btn hangup-btn" id="hangup-btn" onclick="hangUp()" style="display:none;">কল কাটুন ✖</button>
    </div>
</div>

<!-- Incoming Call Fullscreen UI Modal -->
<div id="incoming-modal" class="modal-overlay" style="display:none; background: rgba(0,0,0,0.9);">
    <div class="modal-box" style="text-align:center;">
        <h2 style="color:#22c55e;">incoming Call... 📞</h2>
        <p id="caller-info" style="font-size:18px; color:#fff; margin:20px 0;"></p>
        <div style="display:flex; gap:15px; justify-content:center;">
            <button onclick="answerCall()" style="background:#22c55e; width:120px;">রিসিভ করুন</button>
            <button onclick="rejectCall()" style="background:#ef4444; width:120px;">কেটে দিন</button>
        </div>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>
<script src="app.js"></script>
</body>
</html>
