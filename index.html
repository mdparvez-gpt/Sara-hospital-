<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Hospital - Internal Intercom</title>
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS for WebRTC Calling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="phone-container">
    <!-- Hospital Header -->
    <h2 style="text-align: center; color: #38bdf8; margin-top: 0;">Sara Hospital</h2>
    <p style="text-align: center; color: #94a3b8; font-size: 13px; margin-top: -10px;">Internal Intercom System</p>

    <!-- My Profile Setup (Image removed) -->
    <div class="profile-card" id="profile-area">
        <h4>আপনার প্রোফাইল সেটআপ</h4>
        <input type="text" id="my-name" placeholder="নাম বা ডিপার্টমেন্ট (যেমন: Reception)">
        <input type="text" id="my-ext" placeholder="এক্সটেনশন নম্বর (যেমন: 100)">
        <button onclick="saveProfile()">সেভ করুন</button>
    </div>

    <!-- Screen Display -->
    <div class="screen" id="screen-display">রেডি / নম্বর ডায়াল করুন</div>

    <!-- Keypad -->
    <div class="keypad">
        <button class="btn" onclick="pressKey('1')">1</button>
        <button class="btn" onclick="pressKey('2')">2</button>
        <button class="btn" onclick="pressKey('3')">3</button>
        <button class="btn" onclick="pressKey('4')">4</button>
        <button class="btn" onclick="pressKey('5')">5</button>
        <button class="btn" onclick="pressKey('6')">6</button>
        <button class="btn" onclick="pressKey('7')">7</button>
        <button class="btn" onclick="pressKey('8')">8</button>
        <button class="btn" onclick="pressKey('9')">9</button>
        <button class="btn" onclick="pressKey('*')">*</button>
        <button class="btn" onclick="pressKey('0')">0</button>
        <button class="btn" onclick="pressKey('#')">#</button>
        <button class="btn call-btn" id="call-btn" onclick="makeCall()">কল করুন ☎</button>
        <button class="btn hangup-btn" id="hangup-btn" onclick="hangUp()">কল কাটুন ✖</button>
    </div>

    <!-- Custom Contact Add Section -->
    <div class="add-contact-box">
        <h4>নতুন কন্টাক্ট যোগ করুন (ICU, Pharmacy ইত্যাদি)</h4>
        <input type="text" id="c-name" placeholder="নাম (যেমন: ICU Desk)">
        <input type="text" id="c-ext" placeholder="এক্সটেনশন নম্বর (যেমন: 101)">
        <button onclick="addContact()">তালিকায় যুক্ত করুন</button>
    </div>

    <!-- Directory List -->
    <h4>Sara Hospital ফোনবুক</h4>
    <div class="contact-list" id="contact-list"></div>
</div>

<audio id="remote-audio" autoplay></audio>
<script src="app.js"></script>
</body>
</html>
