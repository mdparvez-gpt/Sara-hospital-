<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Hospital - Office Intercom</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Registration Modal -->
<div id="reg-modal" class="modal-overlay" style="display:none;">
    <div class="landline-base modal-box">
        <div class="brand-title">SARA HOSPITAL</div>
        <div class="brand-sub">INTERNAL IP INTERCOM</div>
        <input type="text" id="reg-name" placeholder="আপনার নাম বা ডিপার্টমেন্ট (যেমন: ICU)">
        <input type="text" id="reg-ext" placeholder="এক্সটেনশন নম্বর (যেমন: 101)">
        <button onclick="registerUser()" class="landline-save-btn">রেজিস্ট্রেশন করুন</button>
    </div>
</div>

<!-- Landline Phone Body -->
<div class="landline-phone" id="app-container" style="display:none;">
    <!-- Top LCD Screen -->
    <div class="lcd-screen">
        <div class="lcd-header">
            <span id="user-info-display">Ext: --</span>
            <span class="live-indicator">● ONLINE</span>
        </div>
        <div class="lcd-display-text" id="screen-display">নম্বর ডায়াল করুন</div>
    </div>

    <!-- Permanent Hospital Directory & Online Status -->
    <div class="directory-panel">
        <div class="directory-title">হাসপাতাল ফোনবুক ও এক্সটেনশন তালিকা</div>
        <div id="directory-users-list" class="users-scroll">
            <span class="no-user">লোড হচ্ছে...</span>
        </div>
        <!-- Add New Directory Contact Button / Form Toggle -->
        <div style="margin-top: 8px; border-top: 1px solid #1e293b; padding-top: 6px; display:flex; justify-content: space-between; align-items:center;">
            <small style="color:#64748b; font-size:11px;">নতুন এক্সটেনশন যোগ করুন:</small>
            <button onclick="toggleAddBox()" style="background:#334155; color:#38bdf8; border:none; padding:2px 8px; border-radius:4px; font-size:11px; cursor:pointer;">+ যুক্ত করুন</button>
        </div>
        <div id="add-dir-box" style="display:none; margin-top:6px;">
            <input type="text" id="new-dir-name" placeholder="নাম (যেমন: OT Desk)" style="width:100%; padding:6px; background:#040812; border:1px solid #334155; color:white; border-radius:4px; font-size:12px; margin-bottom:4px; box-sizing:border-box;">
            <input type="text" id="new-dir-ext" placeholder="এক্সটেনশন (যেমন: 105)" style="width:100%; padding:6px; background:#040812; border:1px solid #334155; color:white; border-radius:4px; font-size:12px; margin-bottom:4px; box-sizing:border-box;">
            <button onclick="addNewDirectoryContact()" style="width:100%; background:#22c55e; color:white; border:none; padding:6px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer;">ফোনে সেভ করুন</button>
        </div>
    </div>

    <!-- Physical Keypad Layout -->
    <div class="keypad-panel">
        <div class="keypad-grid">
            <button class="k-btn" onclick="pressKey('1')">1</button>
            <button class="k-btn" onclick="pressKey('2')">2</button>
            <button class="k-btn" onclick="pressKey('3')">3</button>
            <button class="k-btn" onclick="pressKey('4')">4</button>
            <button class="k-btn" onclick="pressKey('5')">5</button>
            <button class="k-btn" onclick="pressKey('6')">6</button>
            <button class="k-btn" onclick="pressKey('7')">7</button>
            <button class="k-btn" onclick="pressKey('8')">8</button>
            <button class="k-btn" onclick="pressKey('9')">9</button>
            <button class="k-btn" onclick="pressKey('*')">*</button>
            <button class="k-btn" onclick="pressKey('0')">0</button>
            <button class="k-btn" onclick="pressKey('#')">#</button>
        </div>
        <div class="action-row">
            <button class="k-btn backspace-btn" onclick="backspaceKey()">⌫ ডিলিট</button>
            <button class="k-btn call-action-btn" onclick="makeCall()">☎ কল</button>
        </div>
    </div>

    <!-- Footer Controls -->
    <div class="phone-footer">
        <button onclick="logoutUser()" class="logout-link">লগআউট / পরিবর্তন</button>
    </div>
</div>

<!-- Incoming Call Fullscreen Screen -->
<div id="incoming-modal" class="incoming-screen" style="display:none;">
    <div class="incoming-card">
        <div class="ringing-pulse">📞</div>
        <h2>ইনকামিং কল...</h2>
        <p id="caller-info" class="caller-name-display"></p>
        <div class="incoming-buttons">
            <button onclick="answerCall()" class="ans-call-btn">রিসিভ করুন</button>
            <button onclick="rejectCall()" class="rej-call-btn">কেটে দিন</button>
        </div>
    </div>
</div>

<!-- Running Call Screen -->
<div id="active-call-modal" class="incoming-screen" style="display:none;">
    <div class="incoming-card">
        <div class="running-icon">🎙️</div>
        <h3>কথোপকথন চলছে</h3>
        <p id="connected-target-info" class="target-talking"></p>
        <p id="call-timer" class="timer-text">00:00</p>
        <div class="running-controls">
            <button onclick="toggleSpeaker()" id="speaker-btn" class="ctrl-btn">🔊 স্পিকার: বন্ধ</button>
            <button onclick="hangUp()" class="end-call-btn">✖ কল কাটুন</button>
        </div>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>
<script src="app.js"></script>
</body>
</html>
