<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Hospital - Office Intercom</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Registration Modal -->
<div id="reg-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="brand-title">SARA HOSPITAL</div>
        <div class="brand-sub">INTERNAL IP INTERCOM</div>
        <input type="text" id="reg-name" placeholder="আপনার নাম বা ডিপার্টমেন্ট (যেমন: ICU)">
        <input type="text" id="reg-ext" placeholder="এক্সটেনশন নম্বর (যেমন: 101)">
        <button onclick="registerUser()" class="landline-save-btn">রেজিস্ট্রেশন করুন</button>
    </div>
</div>

<!-- Landline Phone Main App Container -->
<div class="landline-phone" id="app-container" style="display:none;">
    <!-- LCD Display -->
    <div class="lcd-screen">
        <div class="lcd-header">
            <span id="user-info-display">Ext: --</span>
            <span class="live-indicator">● ONLINE</span>
        </div>
        <div class="lcd-display-text" id="screen-display">READY</div>
    </div>

    <!-- Active Registered Users Directory -->
    <div class="directory-panel">
        <div class="directory-title">রেজিস্টার্ড ইউজার তালিকা (লাইভ)</div>
        <div id="directory-users-list" class="users-scroll">
            <span class="no-user">লোড হচ্ছে...</span>
        </div>
    </div>

    <!-- Physical Keypad -->
    <div class="keypad-panel">
        <div class="keypad-grid">
            <button class="k-btn" onclick="pressKey('1')">1</button>
            <button class="k-btn" onclick="pressKey('2')">2</button>
            <button class="k-btn" onclick="pressKey('3')">3</button>
            <button class="k-btn" onclick="pressKey('4')">4</button>
            <button class="k-btn" onclick="pressKey('5')">5</button>
            <button class="k-btn" onclick="pressKey('6')">6</button>
            <button class="k-btn" onclick="pressKey('7')">7</button>
            <button class="k-btn" onclick="pressKey('8')">8</button>
            <button class="k-btn" onclick="pressKey('9')">9</button>
            <button class="k-btn" onclick="pressKey('*')">*</button>
            <button class="k-btn" onclick="pressKey('0')">0</button>
            <button class="k-btn" onclick="pressKey('#')">#</button>
        </div>
        <div class="action-row">
            <button class="k-btn backspace-btn" onclick="backspaceKey()">⌫ ডিলিট</button>
            <button class="k-btn call-action-btn" onclick="makeCall()">☎ কল</button>
        </div>
    </div>

    <div class="phone-footer">
        <button onclick="logoutUser()" class="logout-link">লগআউট / অ্যাকাউন্ট পরিবর্তন</button>
    </div>
</div>

<!-- Incoming Call Fullscreen Modal -->
<div id="incoming-modal" class="incoming-screen" style="display:none;">
    <div class="incoming-card">
        <div class="ringing-pulse">📞</div>
        <h2>ইনকামিং কল...</h2>
        <p id="caller-info" class="caller-name-display"></p>
        <div class="incoming-buttons">
            <button onclick="answerCall()" class="ans-call-btn">রিসিভ করুন</button>
            <button onclick="rejectCall()" class="rej-call-btn">কেটে দিন</button>
        </div>
    </div>
</div>

<!-- Active Running Call Screen Modal -->
<div id="active-call-modal" class="incoming-screen" style="display:none;">
    <div class="incoming-card">
        <div class="running-icon">🎙️</div>
        <h3>কথোপকথন চলছে</h3>
        <p id="connected-target-info" class="target-talking"></p>
        <p id="call-timer" class="timer-text">Connecting...</p>
        <div class="running-controls">
            <button onclick="toggleSpeaker()" id="speaker-btn" class="ctrl-btn">🔊 স্পিকার: বন্ধ</button>
            <button onclick="hangUp()" class="end-call-btn">✖ কল কাটুন</button>
        </div>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>
<script src="app.js"></script>
</body>
</html>
