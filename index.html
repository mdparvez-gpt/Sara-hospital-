<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sara Hospital Intercom</title>
    <link rel="stylesheet" href="style.css">
    <!-- PeerJS for WebRTC Calling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- Registration Overlay -->
<div id="reg-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
        <div class="hospital-logo">🏥</div>
        <h2>Sara Hospital</h2>
        <p>ইন্টারকম সিস্টেমে প্রবেশ করুন</p>
        <input type="text" id="reg-name" placeholder="আপনার নাম বা ডিপার্টমেন্ট (যেমন: ICU)">
        <input type="text" id="reg-ext" placeholder="এক্সটেনশন নম্বর (যেমন: 101)">
        <button onclick="registerUser()">যুক্ত হোন</button>
    </div>
</div>

<!-- Main App Container -->
<div class="phone-container" id="app-container" style="display:none;">
    <div class="header-info">
        <div>
            <h3 id="user-info-display" style="margin:0; color:#38bdf8; font-size:16px;"></h3>
            <span class="online-dot"></span> <small style="color:#22c55e;">অনলাইন</small>
        </div>
        <button onclick="logoutUser()" class="logout-btn">লগআউট</button>
    </div>

    <!-- Active Users List (Realtime Sync via Supabase) -->
    <div class="active-users-section">
        <h4>অনলাইন এক্সটেনশনসমূহ</h4>
        <div id="active-users-list" class="users-grid"></div>
    </div>

    <!-- Screen Display / Dialpad Area -->
    <div class="dialpad-card">
        <div class="screen" id="screen-display">নম্বর ডায়াল করুন</div>
        <div class="keypad">
            <button class="btn" onclick="pressKey('1')">1</button>
            <button class="btn" onclick="pressKey('2')">2</button>
            <button class="btn" onclick="pressKey('3')">3</button>
            <button class="btn" onclick="pressKey('4')">4</button>
            <button class="btn" onclick="pressKey('5')">5</button>
            <button class="btn" onclick="pressKey('6')">6</button>
            <button class="btn" onclick="pressKey('7')">7</button>
            <button class="btn" onclick="pressKey('8')">8</button>
            <button class="btn" onclick="pressKey('9')">9</button>
            <button class="btn" onclick="pressKey('*')">*</button>
            <button class="btn" onclick="pressKey('0')">0</button>
            <button class="btn" onclick="pressKey('#')">#</button>
            <button class="btn call-btn" id="call-btn" onclick="makeCall()">কল করুন ☎</button>
        </div>
    </div>
</div>

<!-- Incoming Call Fullscreen UI Modal -->
<div id="incoming-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box ringing-box">
        <div class="pulse-icon">📞</div>
        <h3 style="color:#22c55e; margin:10px 0;">ইনকামিং কল...</h3>
        <p id="caller-info" style="font-size:16px; color:#cbd5e1; margin-bottom:20px;"></p>
        <div class="call-actions">
            <button onclick="answerCall()" class="ans-btn">রিসিভ</button>
            <button onclick="rejectCall()" class="rej-btn">কেটে দিন</button>
        </div>
    </div>
</div>

<!-- Active/Connected Call Running UI Modal -->
<div id="active-call-modal" class="modal-overlay" style="display:none;">
    <div class="modal-box active-call-box">
        <div class="avatar-pulse">🎙️</div>
        <h3 id="connected-target-info" style="color:#fff; margin:10px 0;">কথোপকথন চলছে</h3>
        <p id="call-timer" style="color:#38bdf8; font-size:18px; font-weight:bold; margin-bottom:25px;">00:00</p>
        <button onclick="hangUp()" class="end-call-btn">কল কাটুন ✖</button>
    </div>
</div>

<audio id="remote-audio" autoplay></audio>
<script src="app.js"></script>
</body>
</html>
